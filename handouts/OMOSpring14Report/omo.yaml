# Problem 11
author: Michael Kural
answer: 90
title: Sum of Areas
difficulty: 20
statement: |
  Let $X$ be a point inside convex quadrilateral $ABCD$ with $\angle AXB+\angle CXD=180^{\circ}$. If $AX=14$, $BX=11$, $CX=5$, $DX=10$, and $AB=CD$, find the sum of the areas of $\triangle AXB$ and $\triangle CXD$.
solution: |
  WLOG assume $AB\parallel CD$ (we can rotate either triangle without changing anything.) Then translate $CD$ to $AB$ and $X$ to $X'$ such that $X'AXB$ is a cyclic quadrilateral, so it suffices to find $[X'AXB]$. Also, note that $X'A^2+XB^2=X'B^2+XA^2$. Since we're finding the area of a cyclic quadrilateral, we can rearrange the side lengths, so if we make the order $14,5,11,10$, we get two right triangles with diameter $\sqrt{221}$. Thus the area is $\frac{1}{2}(14\cdot 5+11\cdot 10)$.

  There is also a solution with LoC.
