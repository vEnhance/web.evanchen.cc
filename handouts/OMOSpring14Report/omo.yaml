# Problem 26
author: Evan Chen
answer: 720
title: NT Invariant
difficulty: 50
statement: |
  Qing initially writes the ordered pair $(1,0)$ on a blackboard. Each minute, if the pair $(a,b)$ is on the board, she erases it and replaces it with one of the pairs $(2a-b,a)$, $(2a+b+2,a)$ or $(a+2b+2,b)$.  Eventually, the board reads $(2014,k)$ for some nonnegative integer $k$.  How many possible values of $k$ are there?
solution: |
  This is pretty unoriginal.  Increase both entries in the pair by one.  Then it's just \url{http://en.wikipedia.org/wiki/Coprime#Generating_all_coprime_pairs}.  I thought the tree was cool enough to warrant the stealing though.

  Proof of said Wikipedia lemma is some induction.

  $\frac12 \varphi(2015) = \frac12 \cdot 4 \cdot 12 \cdot 30 = 720$.
comments: |
