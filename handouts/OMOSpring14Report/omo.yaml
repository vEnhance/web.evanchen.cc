# Problem 29
author: Sammy Luo and Evan Chen
answer: 15000
title: Tetrahedron and Perpendiculars
difficulty: 50
statement: |
  Let $ABCD$ be a tetrahedron whose six side lengths are all integers, and let $N$ denote the sum of these side lengths. There exists a point $P$ inside $ABCD$ such that the feet from $P$ onto the faces of the tetrahedron are the orthocenter of $\triangle ABC$, centroid of $\triangle BCD$, circumcenter of $\triangle CDA$, and orthocenter of $\triangle DAB$. If $CD = 3$ and $N < 100{,}000$, determine the maximum possible value of $N$.
solution: |
  Let $H$, $G$, $O$, $H'$ denote the orthocenter of $\triangle ABC$, centroid of $\triangle BCD$, circumcenter of $\triangle CDA$, and orthocenter of $\triangle DAB$, respectively.

  The standard perpendicularity criterion applied to $PH$ and $BC$ and to $PG$ and $BC$ gives $BH^2-CH^2=BP^2-CP^2=BG^2-CG^2$ (so $BC\perp GH$), and similarly for the other five pairs of sides between $ABCD$ and $GOH'H$.

  We can cancel a whole bunch of terms in these expressions (using e.g. $BH^2 = 4R_{ABC}^2-AC^2$ and $BG^2 = \frac 29 (BC^2+CD^2+DB^2) - \frac 13CD^2$). Due to the circumcenter we get $GC^2-GD^2=HA^2-HC^2=H'D^2-H'A^2=0$, so $BC=BD=BA=s$. The remaining equations give \[ \frac{CD^2-s^2}{3}=DA^2-s^2=AC^2-s^2. \]
  Let $DA=AC=a$, so the equation is $3a^2-2s^2=9$. This is a Pell-type equation, and the only solutions small enough are $(a,s)=(3,3),(27,33),(267,327), (2643, 3237)$. So, using the largest one, the answer is $3 + 2 \cdot 2643 + 3 \cdot 3237 = 15000$.
comments: |
  Ok, I think it at least works now :P -Sammy
