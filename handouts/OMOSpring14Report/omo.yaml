# Problem 28
author: Sammy Luo
answer: 7800
title: Losing positions in 3-player Nim
difficulty: 50
statement: |
  In the game of Nim, players are given several piles of stones. On each turn, a player picks a nonempty pile and removes any positive integer number of stones from that pile. The player who removes the last stone wins, while the first player who cannot move loses.

  Alice, Bob, and Chebyshev play a 3-player version of Nim where each player wants to win but avoids losing at all costs (there is always a player who neither wins nor loses). Initially, the piles have sizes $43$, $99$, $x$, $y$, where $x$ and $y$ are positive integers. Assuming that the first player loses when all players play optimally, compute the maximum possible value of $xy$.
solution: |
  Call a game position an A-position if it results in a win for the next player, a C-position if it results in a loss, and a B position otherwise. We use the following definitions to make thing simpler:
  For a nonnegative integer $a = \overline{a_n a_{n-1} \cdots a_1 a_0}_2$ written in base 2, define the ternation of $a$, $a_T$, to be $\overline{a_n a_{n-1} \cdots a_1 a_0}_3$, i.e. the number that results when the base 2 representation of $a$ is interpreted as a base 3 integer.
  Define the trim-sum of two numbers $a = \overline{a_n a_{n-1} \cdots a_1 a_0}_3$ and $b = \overline{b_n b_{n-1} \cdots b_1 b_0}_3$ written in base 3 (possibly with leading zeroes), represented by $a \boxplus b$, such that \[ a \boxplus b = \overline{c_n c_{n-1} \cdots c_1 c_0}_3 \] where $c_i \equiv a_i+b_i \pmod{3}$ is $0,1,$ or $2$.
  The key is the following proposition: A position $P=(x_1,x_2,\cdots,x_n)$ in 3-Nim is a C-position if and only if
  \[ (x_1)_T \boxplus (x_2)_T \boxplus \cdots \boxplus (x_n)_T = 0 \]

  In this case, we want $101011_3 \boxplus 1100011_3 \boxplus x_T \boxplus y_T = 0$, so we need $x_T \boxplus y_T = 2102011_3$. Since the base 3 digits in $x_T$ and $y_T$ are all zero or one, we see that $x_T + y_T = 2102011_3$, so to maximize their product, we make them as close as possible. This is done by assigning the first occurrence of a $1$ in the sum's base 3 representation to $x$ and every other occurrence of a $1$ to $y$, yielding $x=1101000_2=104, y=1001011_2=75$. These multiply to give $\boxed{7800}$.

  The proof of the key result used can actually generalize to more than 3 players, but for simplicity we'll just include the 3-player version.
  We use strong induction on $s:= x_1+x_2+\cdots + x_n$. The theorem statement is trivial for $s=0$ by the definition of a C-position.
  Assume for some $k>0$ that the statement holds for all $s < k$. Consider a position $P=(x_1,x_2,\cdots, x_n)$ with $s=k$. Clearly any move will decrease $s$.
  Let $s_3(P) = (x_1)_T \boxplus (x_2)_T \boxplus \cdots \boxplus (x_n)_T$. We will prove and use the following lemma:
  \textbf{Lemma 1:} Any position $P$ with $s_3(P) \ne 0$ can be moved to one with $s_3(P) = 0$ in at most two moves, while a position $P$ with $s_3(P) = 0$ cannot be moved to another such position in at most two moves.
  For the first part of the lemma:
  Let $s_3(P) = \overline{c_{d-1} c_{d-2} \cdots c_1 c_0}_3$ in base $3$ with $c_{d-1}$ nonzero. If we can show that the lemma is true when the sizes of all piles have $\leq d$ digits in base 2, then in any other case we can ignore all but the last $d$ digits of each pile and perform the same operation on these digits to get the same result.
  Let the largest $3$ piles in $P$ have sizes $a_1>a_2 >a_3$. We are assuming that $a_1$ has at most $d$ digits in base 2. Let $c_{d-1} = j$.
  We use strong induction on $d$ to show that it is possible to perform the operation specified in the lemma with all of $a_1,a_2,\cdots,a_j$ changed. For $d=0$, this is trivial because all the nonempty piles are $1$s, so we remove the $c_0$ biggest piles and are done.
  Now assume it's true for all $d < d_0$ for some $d_0>0$, and consider $d=d_0$.
  Let $c_{d0-1} = j_0$. Then replace $a_1,a_2,\cdots,a_{j0}$ with $a^* = 2^{d_0-1}-1$. This results in a position $P'$ with $d = d' \leq d_0-1$ (since $c_{d_0-1}$ is now 0), so by induction the $c_{d'-1}'$ piles whose last $d'$ digits form the largest base 2 integers possible can be used to do the operation demanded by the lemma. Since all digits of $a^*$ in base 2 are $1$, clearly $a_1,a_2,\cdots,a_j$, which have all been replaced by $a^*$, can be used from now on for any number of digits $d < d_0$ until more than $j_0$ digits are needed for some future digit, in which case we continue using them along with as many of the next largest integers as necessary.
  So the statement holds for $d=d_0$ as well, and by strong induction holds for all $d$.
  Now we prove the second part of the lemma. Assume the opposite, so there are piles $a,b$ in $P$ such that there exist nonnegative integers $a' < a$, $b'\leq b$ with $a_T \boxplus b_T = s_3(P) \boxplus a'_T \boxplus b'_T = a'_T \boxplus b'_T$. Since the digits of $a_T,b_T,a'_T,b'_T$ in base 3 are $0$s and $1$s, summing them pairwise cannot produce "`carry-overs"', so $a_T \boxplus b_T = a_T + b_T$ and $a'_T \boxplus b'_T = a'_T + b'_T$. But then we get $a_T + b_T = a'_T + b'_T$, which is impossible if $a' < a$ and $b' \leq b$ (since it is simple to see, e.g. by expanding out the integers' base representations into polynomials of the base, that $a > a'$ implies $a_T > a'_T$, etc.). This completes the proof of the lemma.
  - - -
  Now we continue with the main proof. If $s_3(P)$ is nonzero, then there exist two piles $a,b$ that can be altered (with $b$ possibly not changed) to produce a position $P'$ with $s_3(P')=0$. Then the player (WLOG player 1) who is faced with position $P$ can alter $a$. If this leaves a position $P'$ with $s_3(P')=0$ already, then $P'$ is a $C$ position by the inductive hypothesis, and $P$ is an $A$ position. Otherwise, player 2 can alter $b$ to leave a position $P'$ with $s_3(P')=0$, which is a $C$ position for player 2, so player 1 would be in an $A$ position, implying $P$ is a $B$ position. In either case, $P$ is not a $C$ position if $s_3(P) \neq 0$.
  If instead $s_3(P) = 0$, notice that altering any pile will result in a position $P'$ with $s_3(P') \neq 0$ (by, e.g., the lemma). $P'$ is then either an A position or a B position. However, by the lemma applied to $P$, $P'$ cannot be moved to a position $P''$ with $s_3(P'')=0$ in one move, and since by the inductive hypothesis such positions are the only $C$ positions, $P'$ cannot be an A position, so it must be a B position, and $P$ is a C position as wanted.
  So the theorem holds for $s=k$ as well, and therefore for all $s$.
comments: |
  This is a simple application of a result I found doing a research project last year (which turns out to be obscurely known).
  Yeah d=40 might actually be closer. The solution is not as hard to think of as the long write-up makes it seem -- Sammy
