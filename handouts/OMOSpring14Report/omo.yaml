# Problem 25
author: Michael Kural
answer: 9901
title: Infinite harmonic Sum
difficulty: 50
statement: |
  If
  \[
  \sum_{n=1}^{\infty}\frac{\frac11 + \frac12 + \dots + \frac 1n}{\binom{n+100}{100}} = \frac pq
  \]
  for relatively prime positive integers $p,q$, find $p+q$.
solution: |
  It is not hard to show that
  \[
  \frac{1}{\binom{n+99}{99}}-\frac{1}{\binom{n+100}{99}}=\frac{\frac{99}{100}}{\binom{n+100}{100}}.
  \]
  So the sum is
  \[
  \frac{100}{99}\left(H_1\left(\binom{100}{99}^{-1}-\binom{101}{99}^{-1}\right)+H_2\left(\binom{101}{99}^{-1}-\binom{102}{99}^{-1}\right)+\cdots\right).
  \]
  which equals
  \[
  100/99\left(\binom{100}{99}^{-1}+\frac{1}{2}\binom{101}{99}^{-1}+\frac{1}{3}\binom{102}{99}^{-1}\cdots\right).
  \]
  Note that $n\binom{99+n}{100}=100\binom{99+n}{100}$, so this becomes
  \[
  \frac{1}{99}\left(\binom{100}{100}^{-1}+\binom{101}{100}^{-1}+\binom{102}{100}^{-1}+\cdots\right).
  \]
  Now again using the first identity, this telescopes and becomes
  \[
  \frac{100}{99^2}\left(\binom{99}{99}\right)=\frac{100}{9801}.
  \]
  Replacing $100$ with a general $k$, the answer is $\frac{k}{(k-1)^2}$.
comments: |
  Probably on the easy side of 50.
  Maybe we can make this less guessable by shifting the sequence (i.e. $\sum_{n\ge1} \frac{H_{n+1}}{\binom{n+101}{100}}$). -- Evan
  Wait hmm, why is this especially guessable right now? (Like even if you replace $100$ with smaller values, you still have to go through most of this process to get an answer, if I'm not mistaken.)--Michael
  Oh okay, that's fine then. I just saw $\frac{k}{(k-1)^2}$ and was like oh god engineer's induction. (A bunch of our hard problems got trolled like this). -- Evan
