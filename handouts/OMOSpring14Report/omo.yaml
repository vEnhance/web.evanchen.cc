# Problem 24
author: Sammy Luo
answer: 21
title: Fixed intercept sum locus
difficulty: 40
statement: |
  Let $\mathcal P$ denote the set of planes in three-dimensional space with positive $x$, $y$, and $z$ intercepts summing to one. A point $(x,y,z)$ with $\min \{x,y,z\} > 0$ lies on exactly one plane in $\mathcal P$. What is the maximum possible integer value of $\left(\frac{1}{4} x^2 + 2y^2 + 16z^2\right)^{-1}$?
solution: |
  The points on the planes in $P$ are of the form $(x,y,z) = (a_1 e_1, a_2 e_2, a_3 e_3)$, where the $a_i$ (axis intercepts) and $e_i$ (weights) both sum to 1. So by Cauchy-Schwarz,
  $1 = (a_1+a_2+a_3)(e_1+e_2+e_3) \geq (\sqrt{a_1 e_1} + \sqrt{a_2 e_2} + \sqrt{a_3 e_3})^2$
  which gives $\sqrt{x}+\sqrt{y}+\sqrt{z}\leq 1$. Equality can be attained for any choice of $x,y,z$ satisfying the equality by (and only by) setting $a_1=e_1=\sqrt{x}$ and so forth.
  So $S$ is the set of points with $\sqrt{x}+\sqrt{y}+\sqrt{z} = 1$. Then by HÃ¶lder (or weighted power mean),
  $(x^3+32y^3+243z^3)(1+\frac{1}{2}+\frac{1}{3})^5\geq (\sqrt{x}+\sqrt{y}+\sqrt{z})^6=1$, with equality when $x=4y=9z$. This gives $x^3+32y^3+243z^3=\frac{1}{(1+\frac{1}{2}+\frac{1}{3})^5}=(\frac{6}{11})^5$, so the answer is $6*11*5*1=\boxed{330}$.

  EDITED version: $\frac{1}{16} ( 1+2+4 )^3 = \frac{343}{16} \to 21$.
comments: |
  Edited. I think this can be easy side of d=40. -- Evan
