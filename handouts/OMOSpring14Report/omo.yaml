# Problem 22
author: Michael Kural and Evan Chen
answer: 620
title: Polynomial Congruence
difficulty: 40
votes: 2
statement: |
  Let $f(x)$ be a polynomial with integer coefficients such that $f(15) f(21) f(35) - 10$ is divisible by $105$. Given $f(-34) = 2014$ and $f(0) \ge 0$, find the smallest possible value of $f(0)$.
solution: |
  Let $p=3,q=5,r=7$.
  Note that
  \[
  f(pq)f(qr)f(rp)=f(pq+qr+rp)f(0)^2\pmod{pqr}
  \]
  This can be proven by considering mod p,mod q, mod r separately.

  For this modified guy, let $x= f(0)$.  We want to solve $f(0)^2 \equiv 10 \cdot 2014^{-1} \equiv (-95) \cdot 19^{-1} \equiv -5 \pmod{105}$.  The solutions are $x \equiv 10, 25, 80, 95 \pmod{105}$ by the Chinese Remainder Theorem.

  In addition, we require $x \equiv f(-34) \equiv 2014 \pmod{34}$; that is, we also need $x \equiv 8\pmod{34}$.  In short we must find the smallest solution for
  \[ x \equiv 10, 25, 80, 95 \pmod{105} \qquad x \equiv 8 \pmod{34} \]
  The $x \equiv 8 \pmod{34}$ becomes $x \equiv 110 \pmod{170}$ (since $5 \mid x$).  We then discover that $x = 620$ is the smallest working value (after trying $110, 280, 450$).
  A working construction is $f(x)=-41x+620$.
comments: |
  sidenote:
  idk if this problem is actually a good "numberification", but the point is I wanted to use the fact that $f(p)f(q)=f(p+q)f(0)\pmod{pq}$, and generalizations for multiple primes.

  Edited and +1. Your earlier version claimed $r^2 \equiv 4 \pmod{105}$ implies $r \equiv \pm 2$.  BTW, I think this is hard for a d=30. -- Evan
  This is much more well hidden now, nice. With the new edit, it's definitely harder-maybe a hard 30 or easy 40? -- Michael
  My pleasure :) I'd say even mid-40 is fine. -- Evan
