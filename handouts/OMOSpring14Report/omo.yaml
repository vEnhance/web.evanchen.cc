# Problem 30
author: Yang Liu
answer: 76
title: Perfect Trees
difficulty: 50
statement: |
  For a positive integer $n$, an \textit{$n$-branch} $B$ is an ordered tuple $(S_1, S_2, \dots, S_m)$ of nonempty sets (where $m$ is any positive integer) satisfying $S_1 \subset S_2 \subset \dots \subset S_m \subseteq \{1,2,\dots,n\}$. An integer $x$ is said to \textit{appear} in $B$ if it is an element of the last set $S_m$.  Define an \textit{$n$-plant} to be an (unordered) set of $n$-branches $\{ B_1, B_2, \dots, B_k\}$, and call it \textit{perfect} if each of $1$, $2$, \dots, $n$ appears in exactly one of its branches.

  Let $T_n$ be the number of distinct perfect $n$-plants (where $T_0=1$), and suppose that for some positive real number $x$ we have the convergence \[ \ln \left( \sum_{n \ge 0} T_n \cdot \frac{\left( \ln x \right)^n}{n!} \right) = \frac{6}{29}. \] If $x = \frac mn$ for relatively prime positive integers $m$ and $n$, compute $m+n$.
solution: |
  The generating function is $e^\frac{e^x-1}{2-e^x}$. I'll supply a proof later.
  Ok, here's a proof:
  Of course we use generating functions. $S(n, k)$ are Stirling numbers of the second kind.

  Lemma 1: The sum is over the nonegative integers $a_i$ for a fixed $n$, \[\sum_{n \ge 0} \left( x^n \cdot \sum_{a_1+2a_2+\ldots na_n} \frac{1}{a_1!a_2! \ldots a_n!} \right) = e^\frac{x}{1-x} \]

  Proof: \[ \sum_{n \ge 0} \left( x^n \cdot \sum_{a_1+2a_2+\ldots na_n} \frac{1}{a_1!a_2! \ldots a_n!} \right) = \prod_{i \ge 1} \left(\sum_{j \ge 0} \frac{x^{ij}}{j!} \right) = \prod_{i \ge 1} e^{x^i} = e^\frac{x}{1-x} \]

  For simplicity later, let \[T_k = \sum_{a_1+2a_2+\ldots na_n} \frac{1}{a_1!a_2! \ldots a_n!} .\]

  Now, we directly count $P_n$. To do this, we do casework on how many vertices we have not including the root. Say we have $k$ vertices, and say from under the root, we have $i$ branches of length $a_i$. Then clearly, $a_1+2a_2+\ldots+ka_k = k$. Now, it's well-known that there are $k! S(n, k)$ ways to assign the numbers $1$ to $n$ to $k$ vertices such that each vertex has at least one number assigned to it. But this overcounts slightly. In fact, we need to divide by $a_1!a_2! \ldots a_n!$ in order to account for permutations of the branches of equal length. So \[P_n = \sum_{k \ge 0} k! S(n, k) T_k \] To finish,

  \[ \sum_{n \ge 0}P_n \cdot \frac{x^n}{n!} = \sum_{n \ge 0} \sum_{k \ge 0} k! S(n, k) T_k \cdot \frac{x^n}{n!} = \sum_{k \ge 0} k! T_k \sum_{n \ge 0} S(n, k) \cdot \frac{x^n}{n!} = \sum_{k \ge 0}T_k (e^x-1)^k = e^\frac{e^x-1}{2-e^x}, \] by Lemma 1. We used the fact that \[ \sum_{n \ge 0} S(n, k) \cdot \frac{x^n}{n!} = \frac{(e^x-1)^k}{k!} \]
comments: |
