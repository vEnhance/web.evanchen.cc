# Problem 16
author: Evan Chen
answer: 119
title: Radioactive Numbers
difficulty: 30
statement: |
  Say a positive integer $n$ is \emph{radioactive} if one of its prime factors is strictly greater than $\sqrt{n}$. For example, $2012 = 2^2 \cdot 503$, $2013 = 3 \cdot 11 \cdot 61$ and $2014 = 2 \cdot 19 \cdot 53$ are all radioactive, but $2015 = 5 \cdot 13 \cdot 31$ is not. How many radioactive numbers have all prime factors less than $30$?
solution: |
  Notice that counting $N$ is just equivalent to counting multisets of primes such that one prime exceeds the product of the others. Let $p$ be the largest prime, and put $N = px$.  Note that $1 \le x \le p-1$ and that any value of $x$ is achievable in exactly one way (by unique prime factorization). Hence for a fixed value of $p$ there are exactly $p-1$ values of $x$ possible, and hence $p-1$ ways.

  The answer is thus \[ \sum_{\substack{p \le 30 \\ p \text{ prime}}} p-1 = 129 - 1 \cdot 10 = \boxed{119}. \qedhere \]
---
# Problem 17
author: Evan Chen
answer: 343
title: Another pentagon AXYZB
difficulty: 40
statement: |
  Let $AXYBZ$ be a convex pentagon inscribed in a circle with diameter $\overline{AB}$.  The tangent to the circle at $Y$ intersects lines $BX$ and $BZ$ at $L$ and $K$, respectively.  Suppose that $\overline{AY}$ bisects $\angle LAZ$ and $AY=YZ$.  If the minimum possible value of \[ \frac{AK}{AX} + \left( \frac{AL}{AB} \right)^2 \] can be written as $\frac{m}{n} + \sqrt{k}$, where $m$, $n$ and $k$ are positive integers with $\gcd(m,n)=1$, compute $m+10n+100k$.
solution: |
  Let $O$ be the midpoint of $AB$, and let $AB = 2r$.  The key observation which will let us set up the algebra is that $\triangle LOY \sim \triangle YBK$.
  First, because $\angle YZA = \angle YAZ = \angle LAZ$, we find $LA$ is a tangent to the semicircle.  This follows because \[ \angle AOL = \frac12 \angle AOY = \angle OBY \implies LO \parallel YB \quad\text{and}\quad \angle AOY = \frac12 \angle AOZ = \angle OBZ \implies YO \parallel ZB. \] So, we may set $YK = kh$ and $KB = kr$, where $AL = LY = h$.

  First, we claim have $\frac{AK}{AX} = \frac{3}{2}k+1$.  By Ptolemy's Theorem on $ABKL$, \[ BL \cdot AK = AL \cdot BK + AB \cdot LK = 2(k+1)rh + khr = (3k+2)hr. \] But $\frac{1}{2} [LAB] = BL \cdot AX = AL \cdot AB = h(2r)$ and the conclusion follows.

  Next we claim $k = \frac{2r^2}{r^2+h^2}$.  This follows from $LB^2 = AL^2 + AB^2 = KL^2 + KB^2$, whence $h^2+4r^2 = (k+1)^2h^2+k^2r^2$.  Then, $k(k+2)h^2 = (4-k^2)r^2$.  Cancelling a factor of $2+k$ gives $kh^2 = (2-k)r^2$, so $k = \frac{2r^2}{r^2+h^2}$.

  Thus, if we let $x = \frac{h}{r}$, we get that
  \begin{align*}
    \frac{AK}{AX} + \left( \frac{AL}{AB} \right)^2 &= \frac{3}{2}k+1 + \left( \frac{h}{2r} \right)^2 \\
    &= \frac{3}{1+x^2} + 1 + \frac{x^2}{4} \\
    &= \frac{3}{4} + \frac{3}{1+x^2} + \frac{1+x^2}{4} \\
    &\ge \frac{3}{4} + 2\sqrt{\frac{3}{4}} \\
    &= \frac{3}{4} + \sqrt{3}
  \end{align*}
  and the answer is $\boxed{343}$.
---
# Problem 18
author: Victor Wang
answer: 25
title: When Diophantine has infinitely many solutions
difficulty: 40
statement: |
  Find the number of pairs $(m,n)$ of integers with $-2014\le m,n\le 2014$ such that $x^3+y^3 = m + 3nxy$ has infinitely many integer solutions $(x,y)$.
solution: |
  This is equivalent to $(x+y+n)(x^2+y^2+n^2-xy-n(x+y)) = m+n^3$, so infinitely many solutions exist if and only if $m = -n^3$.  This permits $-12 \le m \le 12$, giving $25$ solutions.
---
# Problem 19
author: Michael Kural
answer: 100
title: Diophantine with divisor function
difficulty: 30
statement: |
  Find the sum of all positive integers $n$ such that $\tau(n)^2=2n$, where $\tau(n)$ is the number of positive integers dividing $n$.
solution: |
  Note that $n$ is in the form $2u^2$, and $g(n)=d(n)^2/n$ is multiplicative. Now the power of $2$ in $n$ is odd, so we check and obtain $g(2)=g(8)=2$, $g(2^j)<2$ for $j\ge 5$. The power of $p$ for $p>2$ in $n$ is even, and we can check $g(p^{2k})\le 1$ with equality at $p=3,k=0,1$. So $g(n)$ is at most $2$, with equality at $n=2,8,18,72$.
---
# Problem 20
author: Evan Chen
answer: 47
title: Angles in a Triangle
difficulty: 40
statement: |
  Let $ABC$ be an acute triangle with circumcenter $O$, and select $E$ on $\overline{AC}$ and $F$ on $\overline{AB}$ so that $\overline{BE} \perp \overline{AC}$, $\overline{CF} \perp \overline{AB}$.  Suppose $\angle EOF - \angle A = 90^{\circ}$ and $\angle AOB - \angle B = 30^{\circ}$.  If the maximum possible measure of $\angle C$ is $\tfrac mn \cdot 180^{\circ}$ for some positive integers $m$ and $n$ with $m < n$ and $\gcd(m,n)=1$, compute $m+n$.
solution: |
  The key is the following lemma: if $O$ lies in $AEF$ and $\angle EOF - \angle A = 90^{\circ}$ then $\angle A = 45^{\circ}$.  Indeed, the conditions imply that pentagon $BEOFC$ is cyclic, so $\angle BOC = 90^{\circ}$.

  Simple calculations give that $\angle C = 70^{\circ} - \frac 13 \angle A$.  So we wish to minimize $\angle A$.  Note that if $\angle A \le 45^{\circ}$, then $\angle BOC \le 90^{\circ}$ which implies that $O$ lies outside the circle with diameter $\overline{BC}$ while inside $ABC$, which causes the lemma to apply. In other words $\angle A \le 45^{\circ} \implies \angle A = 45^{\circ}$.  So the minimum possible value of $\angle C$ is $55^{\circ}$. This is achieved if $(\angle A, \angle B, \angle C) = (45^{\circ}, 80^{\circ}, 55^{\circ})$.

  Converting to radians, $55^{\circ} = \frac{11}{36} \pi$ and $11+36 = \boxed{47}$.
comments: |
  Hard for a d=40. Maybe early d=50.
---
# Problem 21
author: Michael Kural and Evan Chen
answer: 15
title: Number Bases
difficulty: 40
votes: 1
statement: |
  Let $b = \frac 12 (-1 + 3\sqrt{5})$.  Determine the number of rational numbers which can be written in the form \[ a_{2014}b^{2014} + a_{2013}b^{2013} + \dots + a_1b + a_0 \] where $a_0, a_1, \dots, a_{2014}$ are nonnegative integers less than $b$.
solution: |
  Basically Kural's solution for the $b^2+b=3$ version, but this time $b^2+b=11$.

  Let $c_n = \frac{1}{3\sqrt{5}} \left( b^n - \overline b^n \right)$, and compute $c_0 = 0$, $c_1 = 1$, and $c_{n} = -c_{n-1} + 11c_{n-2}$.  The first few terms of the sequence are $0,1,-1,12,-23,155,-408,2113,\dots$.

  The problem is equivalent to finding the $a_i$ such that $a_0c_0 + a_1c_1 + \dots + a_nc_n = 0$.  This is because if $\sum_n a_nb^n$ is rational, so is its conjugate, implying the difference is zero.

  It's not hard to verify that $\left\lvert c_n \right\rvert > 2\left\lvert c_{n-1} + c_{n-3} + \dots \right\rvert$ for each $n \ge 5$.  Hence we only need to consider the case where $a_5=a_6=\dots=0$.  This is simple casework (noting that $12$ and $-23$ are overwhelming the largest terms), and the solutions are \[ (a_1,a_2,a_3,a_4) \in \left\{ (0,0,0,0), (1,1,0,0), (2,2,0,0), (0,1,2,1), (1,2,2,1) \right\}. \] where $a_0$ can be arbitrary (as $c_0 = 0$).  Hence there are $\boxed{15}$ $5$-tuples.
