# Problem 27
author: Michael Kural
answer: 301
title: Expected Length of a Game
difficulty: 50
statement: |
  A frog starts at $0$ on a number line and plays a game. On each turn the frog chooses at random to jump $1$ or $2$ integers to the right or left. It stops moving if it lands on a nonpositive number or a number on which it has already landed. If the expected number of times it will jump is $\frac{p}{q}$ for relatively prime positive integers $p$ and $q$, find $p+q$.
solution: |
  Let $f(n)$ be the number of paths of length $n$, and let $f(n,k)$ be the number of paths of length $n$ that start with $k$ $2$-jumps to the right. (Note $f(n)=f(n,0)+\cdots+f(n,n)$.) When it either goes back or forward $1$, it either has to keep going back between numbers it has already landed on, or go forward in a state similar to the beginning position. We get a recursion for $f(n,k)$ and then the recursion
  \[f(n)=2f(n-1)+f(n-3)+1\]
  The expected value is just $\sum n\cdot g(n)$, where $g(n)$ is the probability that it jumps $n-1$ times and fails on its $n$th. Note that $g(0)+g(1)+g(2)+\cdots+g(k)+\frac{f(k)}{4^k}=1$, so manipulation yields
  \[
  \sum n\cdot g(n)=\sum \frac{f(n)}{4^n}
  \]
  Which can be calculated with the above recursion.
comments: |
  dammit I accidentally checked this instead of the final #25. But I did get 301 (208/93) as well, so at least nobody needs to check this if we decide to use it in the future. A bit too computational for me though. -- Victor
